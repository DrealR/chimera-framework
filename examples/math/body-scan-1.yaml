fruit:
  type: Paramecia
  core_insight: The most powerful body in mathematics is not a generator (like primes) but a preserver — 1's strength lies
    in what it does not do (transform the operand) rather than what it does. This inverts the intuition that power comes from
    action; in multiplicative systems, power comes from stillness.
  novelty: 0.9
