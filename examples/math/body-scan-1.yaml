skeleton: The body that is not a number but the condition for all numbers to be themselves — the still-point where multiplication
  becomes identity, and identity becomes the universe of all that can be multiplied.
powers:
  perceive: active
  govern: active
  project: muted
  create: absent
  release: active
  primary_gap: create
  gap_reason: '1 is the only number that cannot create new numbers through multiplication. Its power gap is structural: it
    is the foundation of multiplicative identity, but not of multiplicative generation. The gap is not a weakness but a feature
    — it is the still-point that enables all other numbers to generate structure.'
