- name: THRESHOLD ANCHOR
  description: The power to define the boundary between nothing (empty set) and something (additive identity). This anchors
    the conceptual framework of absence and presence in mathematics.
- name: STRUCTURAL SEED
  description: The power to enable higher-dimensional mathematical structures (e.g., negative numbers, ring theory, topology)
    by serving as the irreducible constant in additive systems. Zero is the 'seed' from which these structures grow.
