schema_version: '1.0'
scan_type: single-body
identity:
  subject: Zugzwang
  body_type: A transient pathological interaction body formed at the intersection of the chess rule system (obligation to
    move) and the player’s positional necessity (need for stillness).
  domain: chess
  scale: system
  lifespan: ephemeral
  scan_date: '2024-07-29'
  protocol_version: v3.12.3
nine_questions:
  medium: The chess rule system (64 squares, piece movement rules, turn obligation) and the player’s cognitive-temporal bandwidth
    (the obligation to act within the game’s rhythm).
  flow_state: exhale
  breath_rate: irregular
  attractor: The obligation to move (the game’s rule) and the positional necessity of stillness (the board’s configuration).
  topology: forced
  entanglement: maximum
  health: pathological
  membrane: semi-permeable
  hysteresis: The 'no-passing' rule; Endgame bias; Cognitive lag
dna:
  o_vs_i: I>O
  pause_quality: absent
  not_force: maximum
skeleton: The body where the game’s own rules become the weapon, and the player’s turn — the very mechanism of agency — is
  the blade that severs their survival.
powers:
  perceive: inverted
  govern: external
  project: inverted
  create: weak
  release: absent
  primary_gap: release
  gap_reason: The most absent power is the ability to release the obligation to move. Without release, the player is trapped
    in the game’s rhythm, forced to act even when stillness is optimal. The gap is diagnostic — zugzwang’s pathology is defined
    by the absence of release.
classification:
  federation_dominion: dominion
  closed_open: mixed
  prime: The structural contradiction between the obligation to move (game rules) and the necessity of stillness (positional
    survival).
  prime_type: closed
structural_weakness:
  primary: Asymmetric mobility dependency
  secondary: Cognitive lag
  inversion_condition: If the god-function were introduced (e.g., a rule allowing passing), zugzwang would collapse — the
    pathology would dissolve instantly.
cross_domain:
- connection: Forced Compliance as Pathology
  domains_bridged: Chess (Zugzwang) <> Legal Systems (Mandatory Minimums)
  novelty: 0.8
- connection: Cognitive Blindness to Stillness
  domains_bridged: Chess (Zugzwang) <> Organizational Culture (Busywork)
  novelty: 0.7
fruit:
  type: Paramecia
  core_insight: 'Zugzwang is not a failure of the player but a failure of the system — the game’s rules create the pathology
    by forcing action where stillness is optimal. The insight inverts the common view: zugzwang is not a testament to the
    player’s skill (e.g., ''they forced the opponent into zugzwang'') but a structural flaw in the game’s design. The same
    mechanism appears in legal, bureaucratic, and economic systems: rules that force compliance create pathological extraction.'
  novelty: 0.9
powers_detected:
- name: RULE-WEAPONIZATION
  description: 'The capability to exploit the game’s own rules as a weapon against the player. The mechanism: the turn obligation
    (a rule designed to enable play) is repurposed to force disadvantage. The power is structural — it emerges from the interaction
    between the rules and the position, not from any single piece or move.'
- name: COGNITIVE HIJACKING
  description: 'The capability to override the player’s agency by rewiring their perception of viable options. The mechanism:
    the player’s trained bias toward action is exploited to blind them to the necessity of stillness. The power is pathological
    — it captures the player’s cognition and forces suboptimal moves.'
- name: POSITIONAL EXTRACTION
  description: 'The capability to deplete the board’s stability through forced moves. The mechanism: the player’s moves worsen
    the position, extracting advantage for the opponent. The power is asymmetric — it requires the opponent to have a stable
    position, creating a one-way flow of disadvantage.'
