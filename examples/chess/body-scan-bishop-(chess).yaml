nine_questions:
  medium: 64-square checkered board with strict alternating color pattern.
  flow_state: pause
  breath_rate: moderate
  attractor: Long diagonals, particularly the central a1-h8 and h1-a8 diagonals.
  topology: mixed
  entanglement: high
  health: inflamed
  membrane: semi-closed
  hysteresis: Pawn structure scars - early pawn moves create permanent diagonal channels or blocks that constrain bishop mobility
