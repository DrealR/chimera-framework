- connection: Linear Projection Under Constraint
  domains_bridged: Chess <> Physics
  novelty: 0.4
fruit:
  type: Paramecia
  core_insight: The bishop reveals that maximum power and maximum vulnerability can be structurally identical - the same color-binding
    that enables unlimited diagonal projection also creates complete blindness to half the battlefield. This suggests that
    optimization within constraints necessarily creates brittleness outside those constraints, and that the most powerful
    specialized tools are simultaneously the most fragile.
  novelty: 0.7
powers_detected:
- name: DIAGONAL DOMINANCE
  description: Projects unlimited linear influence along diagonal vectors, controlling multiple squares simultaneously through
    pure geometric extension. The mechanism converts single-square occupation into multi-square territorial control through
    unobstructed straight-line projection.
- name: COLOR LOCK
  description: Maintains perfect fidelity to color constraint across all moves, never accessing opposite-colored squares regardless
    of strategic incentives. The mechanism trades tactical flexibility for strategic reliability within its operational domain.
- name: GEOMETRIC AMPLIFICATION
  description: Converts central positioning into exponentially increased influence through diagonal multiplication. The mechanism
    leverages board geometry where central squares provide access to maximum diagonal networks.
