skeleton: The piece that trades universality for penetration - gaining infinite projection along chosen angles by permanently
  sacrificing access to half the battlefield.
powers:
  perceive: selective
  govern: absent
  project: active
  create: monotonic
  release: blocked
  primary_gap: release
  gap_reason: 'The bishop''s inability to release its color-binding creates cascading limitations: cannot access half the
    board, cannot escape pawn blockades on its color, cannot adapt when the game shifts to opposite-colored squares.'
classification:
  federation_dominion: federation-leaning
  closed_open: closed-knowledge
  prime: Diagonal projection under color constraint
  prime_type: closed
structural_weakness:
  primary: Color-binding creates fundamental brittleness.
  secondary: Irrelevance when critical action shifts to opposite-colored squares.
  inversion_condition: When the game's critical action shifts to squares of the opposite color, the bishop becomes structurally
    irrelevant.
cross_domain:
- connection: Specialist vs Generalist Trade-off
  domains_bridged: Chess <> Evolution
