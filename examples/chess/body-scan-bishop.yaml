schema_version: '1.0'
scan_type: single-body
identity:
  subject: Bishop
  body_type: Constrained-movement, color-bound, high-mobility piece within a discrete, turn-based system.
  domain: chess
  scale: Individual game piece within the context of a single chess game.
  lifespan: From the start of a game until it is captured or the game ends (checkmate, stalemate, draw).
  scan_date: '2024-07-30'
  protocol_version: v3.12.3
nine_questions:
  medium: The chess board (64 squares) and the rules of chess (defining movement, capture, and game objectives).
  flow_state: pause
  breath_rate: variable
  attractor: Open diagonals, enemy pieces available for capture, and key squares (e.g., squares controlling the center or
    protecting the king).
  topology: O>I
  entanglement: high
  health: healthy
  membrane: semi-permeable
  hysteresis: Its initial square and color-bound nature. Once placed on a light or dark square, it is forever restricted to
    that color, even if it moves across the entire board. This initial condition permanently shapes its available paths and
    influence.
dna:
  o_vs_i: O>I
  pause_quality: structural
  not_force: high
skeleton: The body that finds its immense power in the absence of constraint, yet is forever bound by the color of its origin,
  demonstrating that liberation of movement only amplifies the significance of initial conditions.
powers:
  perceive: rewired
  govern: absent
  project: active
  create: monotonic
  release: absent
  primary_gap: govern
  gap_reason: The Bishop's complete lack of self-governance is its most significant power gap. While its perception is rewiring
    through the player, its inability to self-regulate or initiate action means it is a tool, not an agent. This absence of
    governance makes it entirely dependent and predictable within the game's rules.
classification:
  federation_dominion: federation
  closed_open: mixed
  prime: Directional long-range traversal, color-bound.
  prime_type: closed
structural_weakness:
  primary: inherent color-bound limitation
  secondary: lack of open diagonals
  inversion_condition: When a Bishop is forced into a position where it can only make isolated transactions (captures) without
    contributing to overall board control, its O>I nature could be inverted to I>O, as it primarily 'takes' without 'giving'
    influence.
cross_domain:
- connection: Color-Bound Specialization
  domains_bridged: Chess <> Biology
  novelty: 0.8
- connection: Long-Range, Line-of-Sight Influence
  domains_bridged: Chess <> Military Strategy
  novelty: 0.7
- connection: Bounded Liberty
  domains_bridged: Chess <> Political Philosophy
  novelty: 0.9
fruit:
  type: Paramecia
  core_insight: The Bishop reveals that even in bodies designed for expansive movement and influence, the most profound structural
    limitations are often embedded in the initial conditions, permanently bifurcating its operational reality. Its power is
    not merely despite these limits, but often *because* of the channeled focus they enforce.
  novelty: 0.8
powers_detected:
- name: DIAGONAL DOMINATION
  description: The capability to project influence and threaten across any number of unobstructed squares along a diagonal
    line, making it a potent long-range force.
- name: COLOR-ANCHORED MOBILITY
  description: The power to move with great freedom, but only on squares of a single color, which simultaneously defines its
    operational space and its inherent blind spot.
- name: STRATEGIC CHANNELING
  description: The ability to convert open board space into focused strategic pressure, leveraging absence of constraint (open
    diagonals) to amplify its presence and threat.
