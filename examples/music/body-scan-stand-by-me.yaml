  subject: Stand By Me (1961 recording by Ben E. King)
  body_type: A self-replicating musical composition-body that persists through performance, recording, and cultural memory.
  domain: Music
  scale: cultural organism
  lifespan: 63 years and counting
  scan_date: '2024-07-30'
