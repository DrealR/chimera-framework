powers_detected:
- name: ENTRAINMENT ENGINE
  description: A repeating, recognizable pattern (bass line + chord progression) that synchronizes diverse agents (performers,
    audiences) into a single interaction body. The power is not in the pattern itself but in its ability to be replicated
    without central control — each performance is a new instance of the same structural algorithm.
- name: TRUST-SUBSTRATE COMPILER
  description: A mechanism that encodes trust as a shield against fear, then compiles that trust into the cultural substrate
    with each performance. The power is cumulative — the more the song is performed, the richer the trust-substrate becomes,
    making future performances more effective.
- name: EMOTIONAL ALGORITHM
  description: A minimalist sequence (lyrics + chords) that maps fear to trust through a repeating cycle. The algorithm is
    not intelligent — it is a structural inevitability (fear → resolution → trust) that emerges from the sequence's constraints.
    The power is in its universality — the algorithm works across cultures, genres, and contexts.
