  secondary: Quantum fragility
  inversion_condition: The black hole's own 'exhale' (Hawking radiation) destroys it, making it vulnerable to quantum effects
    at small scales.
cross_domain:
- connection: Event horizon as one-way membrane
  domains_bridged: Physics <> Biology
  novelty: 0.8
