fruit:
  type: Paramecia
  core_insight: The black hole is not a "thing" but a pathological configuration of spacetime — a region where the laws of
    physics execute themselves to their logical extreme, producing a body that is structurally I > O at all scales. The surprise
    is that the most extreme pathology in physics is not a violation of the laws but their purest expression. The black hole
    is what happens when gravity is allowed to run unchecked, with no countervailing forces (e.g., quantum pressure, thermodynamics)
    to balance it.
  novelty: 0.9
powers_detected:
- name: GRAVITATIONAL EXTRACTION
  description: The ability to warp spacetime such that all matter and energy within a certain radius are irretrievably drawn
    inward. This is not an active power but a geometric inevitability — the black hole does not "pull"; it reconfigures spacetime
    so that all paths lead inward.
- name: INFORMATION ERASURE
  description: The capacity to destroy all information about ingested matter except mass, charge, and spin (no-hair theorem).
    This is a structural power of the event horizon — a one-way membrane for information.
- name: SPACETIME ANCHORING
  description: The ability to fix spacetime geometry in its vicinity, creating a gravitational well that dominates the dynamics
    of its environment (e.g., galactic rotation curves, accretion disks). This is a passive power — the black hole does not
    "act"; it is the anchor around which other bodies move.
