  not_force: high
skeleton: The body that inverts the cosmic arrow of time — taking in matter, energy, and information but returning only thermal
  noise, proving that the most extreme pathology in physics is not a breakdown of the laws but their most faithful execution.
powers:
  perceive: absent
  govern: absent
  project: inverted
  create: weak
  release: blocked
  primary_gap: govern
  gap_reason: The absence of governance is the root gap. Without governance, the black hole cannot regulate its own growth,
    respond to its environment, or preserve information. The other gaps (perceive, create, release) cascade from this — a
    body that cannot govern cannot develop perception, creativity, or release mechanisms.
